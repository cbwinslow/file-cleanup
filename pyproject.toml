[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "file-cleanup-utility"
version = "0.1.0"
description = "A powerful file system cleanup and analysis tool"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Blaine Winslow", email = "blaine.winslow@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "rich>=13.0.0",
    "python-magic>=0.4.24",
    "numpy>=1.21.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
    "python-dateutil>=2.8.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "isort>=5.0",
    "mypy>=1.0",
    "flake8>=6.0.0",
    "pre-commit>=3.0.0"
]

[project.scripts]
file-cleanup = "file_cleanup.cli:main"

[project.urls]
Homepage = "https://github.com/cbwinslow/file-cleanup"
Bug-Tracker = "https://github.com/cbwinslow/file-cleanup/issues"
Source = "https://github.com/cbwinslow/file-cleanup"

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[[tool.mypy.overrides]]
module = [
    "numpy.*",
    "scipy.*",
    "sklearn.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=file_cleanup --cov-report=term-missing"
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["file_cleanup"]
omit = ["**/__init__.py", "**/tests/**"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
]

[tool.ruff]
line-length = 88
target-version = "py38"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by black)
    "F401",  # unused imports (handled by flake8)
    "F403",  # wildcard imports
    "F405",  # name might be undefined
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]  # Use of assert in tests is fine

[metadata]
license_files = ["LICENSE"]
description-file = "README.md"
