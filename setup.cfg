[metadata]
description-file = README.md
license_file = LICENSE

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
addopts = -v --cov=file_cleanup --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=junit/test-results.xml
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ImportWarning
    ignore::ResourceWarning

[coverage:run]
source = file_cleanup
omit = 
    */tests/*
    */__pycache__/*
    */_version.py
    */setup.py

[coverage:report]
# Regexes for lines to exclude from consideration
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    
    # Don't complain about missing debug-only code:
    def __repr__
    if self\.debug
    
    # Don't complain if tests don't hit defensive assertion code:
    raise AssertionError
    raise NotImplementedError
    
    # Don't complain if non-runnable code isn't run:
    if 0:
    if __name__ == .__main__.:
    
    # Don't complain about abstract methods
    @(abc\.)?abstractmethod
    
    # Type checking
    if TYPE_CHECKING:

[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .pytest_cache,
    .tox,
    .mypy_cache,
    build,
    dist,
    venv,
    .venv,
    env,
    .env

[mypy]
python_version = 3.8
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
disallow_incomplete_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True

[isort]
line_length = 88
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True

[pycodestyle]
max-line-length = 88

[pycodestyle:*.py]
max-line-length = 88

[pycodestyle:*.pyi]
max-line-length = 88

[pycodestyle:setup.py]
max-line-length = 88

[pycodestyle:docs/conf.py]
max-line-length = 88

[pycodestyle:docs/source/conf.py]
max-line-length = 88

[pycodestyle:examples/*.py]
max-line-length = 88

[pycodestyle:tests/*.py]
max-line-length = 88

[pycodestyle:file_cleanup/*.py]
max-line-length = 88

[pycodestyle:file_cleanup/**/*.py]
max-line-length = 88
